name: rento_app
description: RENTO - P2P Rental Marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.5


  # State Management
  provider: ^6.1.1

  # HTTP
  http: ^1.1.2
  socket_io_client: ^2.0.3+1

  # Navigation
  go_router: ^13.2.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Utils
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Payment
  razorpay_flutter: ^1.3.6

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  http_parser: ^4.1.2
  google_sign_in: ^6.2.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
